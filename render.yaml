services:
  - type: web
    name: order-intake
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: order-intake-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: EXTRACTION_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false   # set in the Render dashboard
      - key: ENVIRONMENT
        value: production

databases:
  - name: order-intake-db
    plan: free
